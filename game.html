<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shape Game</title>

  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <!-- Wrong Shape Popup -->
  <div id="wrong-popup" class="hidden">
  
    <div class="wrong-popup-content">
  
      <h2>WRONG SHAPE</h2>
  
      <p>Try Again!</p>
  
      <button id="wrong-retry-btn">
        RETRY
      </button>
  
    </div>
  
  </div>

  <div id="game-container">
    <div class="bg-shapes">
    
      <span class="bg-circle"></span>
    
      <span class="bg-square"></span>
    
      <span class="bg-triangle"></span>
    
    </div>
  
    <!-- Header -->
    <header id="game-header">
    
      <div class="left-section">
        <button id="settings-btn">⚙️</button>
    
        <div id="game-info">
          <span>Score: <strong id="score">0</strong></span>
          <span>Level: <strong id="level">1</strong></span>
        </div>
      </div>
      <button id="sound-btn">🔊</button>
    
    </header>
  
    <div id="game-content">
    
      <!-- Target Shape -->
      <section id="target-area">
        <h2>Target Shape</h2>
        <canvas id="shapeCanvas"></canvas>
      </section>
    
      <!-- Play Area -->
      <section id="play-area">
        <canvas id="gameCanvas"></canvas>
      </section>
    
    </div>
  
    <!-- Settings -->
    <div id="settings-menu" class="hidden">
    
      <button class="menu-btn" id="home-btn">
        🏠
        <span>Home</span>
      </button>
    
      <button class="menu-btn" id="clue-btn">
        💡
        <span>Clue</span>
      </button>
    
      <button class="menu-btn" id="retry-btn">
        🔄
        <span>Retry</span>
      </button>
    
      <button class="menu-btn" id="share-btn">
        📤
        <span>Share</span>
      </button>
    
    </div>
    <!-- Level Complete Popup -->
    <!-- Level Complete Popup -->
    <div id="level-popup" class="hidden">
    
      <div class="popup-content">
    
        <h2 id="popup-title">
          SHAPE COMPLETED!
        </h2>
    
    
        <div class="stars">
          ⭐ ⭐ ⭐
        </div>

      <p id="popup-score">Score: 40</p>
    
    
        <p id="popup-message">
          Perfect! Outstanding!
        </p>
    
    
        <button id="next-level-btn">
          NEXT LEVEL
        </button>
    
    
      <button id="level-retry-btn">
        RETRY
      </button>
    
    
      </div>
    
    </div>
    <!-- Clue Message -->
    <div id="clue-message" class="hidden">
      💡 Follow the highlighted shape
    </div>
  
  
  </div>

  <script type="module" src="./js/main.js"></script>

</body>

</html>
