<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shape Game</title>

  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>

  <div id="game-container">
  
    <!-- Header -->
    <header id="game-header">
    
      <div class="left-section">
        <button id="settings-btn">⚙️</button>
    
        <div id="game-info">
          <span>Score: <strong id="score">0</strong></span>
          <span>Level: <strong id="level">1</strong></span>
        </div>
      </div>
    
    </header>
  
    <!-- Target Shape -->
    <section id="target-area">
      <h2>Target Shape</h2>
  
      <canvas id="shapeCanvas"></canvas>
    </section>
  
    <!-- Play Area -->
    <section id="play-area">
      <canvas id="gameCanvas"></canvas>
    </section>
  
    <!-- Settings -->
    <div id="settings-menu" class="hidden">
    
      <button class="menu-btn" id="home-btn">
        🏠
        <span>Home</span>
      </button>
    
      <button class="menu-btn" id="clue-btn">
        💡
        <span>Clue</span>
      </button>
    
      <button class="menu-btn" id="retry-btn">
        🔄
        <span>Retry</span>
      </button>
    
      <button class="menu-btn" id="share-btn">
        📤
        <span>Share</span>
      </button>
    
    </div>
  
  </div>

  <script type="module" src="./js/main.js"></script>

</body>

</html>
